name: Deploy Finora frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Prepare Finora frontend
        run: |
          rm -rf site
          mkdir site

          cp -R frontend/. site/

          echo "===== FINORA SITE ====="
          find site -maxdepth 2 -type f | sort

          echo "===== VERIFY ====="

          if [ ! -f "site/index.html" ]; then
            echo "ERROR: site/index.html missing"
            exit 1
          fi

          if [ ! -f "site/version.json" ]; then
            echo "ERROR: site/version.json missing"
            exit 1
          fi

          echo "index.html: OK"
          echo "version.json: OK"

      - name: Upload Finora Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./site

      - name: Deploy Finora
        id: deployment
        uses: actions/deploy-pages@v4
